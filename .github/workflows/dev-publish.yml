name: Build and deploy dev portfolio

on:
  push:
    branches: [dev]
    paths-ignore:
      - deploy/dev/kustomization.yaml
      - deploy/argocd/**
      - '**/*.md'
  workflow_dispatch: {}

concurrency:
  group: portfolio-dev
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/joex422/web-portfolio
  DEV_IMAGE_TAG: dev-${{ github.sha }}

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.DEV_IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=portfolio-dev
          cache-to: type=gha,mode=max,scope=portfolio-dev
      - name: Update dev deployment image
        shell: bash
        run: |
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "$GITHUB_SHA" ]; then
            echo "A newer dev commit exists; leaving deployment to its build."
            exit 0
          fi
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          path = Path("deploy/dev/kustomization.yaml")
          updated, count = re.subn(r"(?m)^    newTag: .*?$", "    newTag: " + os.environ["DEV_IMAGE_TAG"], path.read_text())
          if count != 1:
              raise SystemExit("Expected exactly one dev image tag")
          path.write_text(updated)
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/dev/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy dev image $DEV_IMAGE_TAG"
          git push origin HEAD:dev
